<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisata API Dashboard</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:10px;border:1px solid #cfd6e3;border-radius:9px}button{cursor:pointer;background:#172033;color:#fff}.muted{color:#667085;font-size:14px}.key{font-family:ui-monospace,monospace;word-break:break-all;background:#f2f4f7;padding:9px;border-radius:8px}.hidden{display:none}h1{margin:0 0 4px}</style></head><body><div class="wrap"><h1>Wisata API Dashboard</h1><p class="muted">Login JWT, kelola API key, dan lihat ringkasan pemakaian.</p><div id="auth" class="grid"><div class="card"><h2>Login</h2><input id="lemail" placeholder="Email" type="email"><br><br><input id="lpass" placeholder="Password" type="password"><br><br><button onclick="login()">Login</button><p id="lmsg" class="muted"></p></div><div class="card"><h2>Register</h2><input id="rname" placeholder="Nama"><br><br><input id="remail" placeholder="Email" type="email"><br><br><input id="rpass" placeholder="Password min. 8 karakter" type="password"><br><br><button onclick="register()">Create account</button><p id="rmsg" class="muted"></p></div></div><div id="dash" class="hidden"><div class="grid"><div class="card"><h3>Profil</h3><div id="profile"></div></div><div class="card"><h3>Usage</h3><div id="usage"></div></div></div><div class="card" style="margin-top:16px"><h3>API Keys</h3><div class="row"><input id="keyname" value="Default key" placeholder="Nama key"><button onclick="createKey()">Buat API Key</button><button onclick="logout()">Logout</button></div><div id="keys" style="margin-top:14px"></div></div></div></div><script>let token=localStorage.getItem('wisata_jwt');const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{'Authorization':'Bearer '+token}:{});const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request gagal');return d}async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('lemail').value,password:$('lpass').value})});token=d.token;localStorage.setItem('wisata_jwt',token);showDash();}catch(e){$('lmsg').textContent=e.message}}async function register(){try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('rname').value,email:$('remail').value,password:$('rpass').value})});token=d.token;localStorage.setItem('wisata_jwt',token);showDash();}catch(e){$('rmsg').textContent=e.message}}async function showDash(){try{const [me,ks,u]=await Promise.all([api('/api/auth/me'),api('/api/keys'),api('/api/usage')]);$('auth').classList.add('hidden');$('dash').classList.remove('hidden');$('profile').textContent=me.name+' - '+me.email;$('usage').innerHTML='<b>'+u.summary.requests+'</b> requests<br><b>'+u.summary.successful+'</b> success<br><b>'+u.summary.failed+'</b> failed<br><b>'+u.summary.avg_response_ms+' ms</b> avg response';renderKeys(ks.data)}catch(e){logout()}}function renderKeys(ks){$('keys').innerHTML=ks.map(k=>'<div class="card" style="margin:8px 0"><b>'+k.name+'</b><div class="muted">'+k.key_prefix+'... | '+(k.revoked_at?'REVOKED':'ACTIVE')+'</div><div class="muted">Last used: '+(k.last_used_at||'-')+'</div>'+(!k.revoked_at?'<button onclick="revokeKey(\''+k.id+'\')">Revoke</button>':'')+'</div>').join('')||'<p class="muted">Belum ada key.</p>'}async function createKey(){try{const d=await api('/api/keys',{method:'POST',body:JSON.stringify({name:$('keyname').value})});alert('Simpan API key ini sekarang:\n\n'+d.api_key);showDash()}catch(e){alert(e.message)}}async function revokeKey(id){try{await api('/api/keys/'+id+'/revoke',{method:'PATCH'});showDash()}catch(e){alert(e.message)}}function logout(){token=null;localStorage.removeItem('wisata_jwt');location.reload()}if(token)showDash();</script></body></html>
